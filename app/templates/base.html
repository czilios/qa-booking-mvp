<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Wrzosowo 159
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}?v=20261031-ui"
    >
</head>

<body>

<header class="site-header">
    <a href="{{ ui_url(request, '/ui') }}" class="site-logo-link" aria-label="Wrzosowo 159 — strona główna">
        <img
            src="{{ url_for('static', path='images/logo.png') }}"
            alt="Wrzosowo 159"
            class="site-logo"
        >
    </a>
</header>

<nav class="main-nav">

    <div class="nav-section">

        <span class="nav-section-title">
            Rezerwacje
        </span>

        <a href="{{ ui_url(request, '/ui') }}">
            Dostępność
        </a>

        <a href="{{ ui_url(request, '/ui/inquiries') }}">
            Zapytania WWW
        </a>

    </div>

    <div class="nav-section">

        <span class="nav-section-title">
            Finanse
        </span>

        <a href="{{ ui_url(request, '/ui/bank-transactions') }}">
            Dodaj wpływ
        </a>

    </div>

    <div class="nav-section">

        <span class="nav-section-title">
            Raporty
        </span>

        <a href="{{ ui_url(request, '/ui/reports/overall') }}">
            Raport ogólny
        </a>

        <a href="{{ ui_url(request, '/ui/reports/accounting') }}">
            Raport księgowy
        </a>

        <a href="{{ ui_url(request, '/ui/reports/sales') }}">
            Raport sprzedażowy
        </a>

    </div>

    <div class="nav-section">

        <span class="nav-section-title">
            Uzgodnienia
        </span>

        <a href="#">
            Uzgodnienia
        </a>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
